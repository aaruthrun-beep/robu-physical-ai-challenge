# =============================================================================
# Nite 369 — Single-File Configuration (GRBL-style)
# =============================================================================
# One file configures ALL THREE Picos:
#   [MASTER]  -> Master Pico (W5500 Ethernet + SPI bridge)
#   [SLAVE1]  -> Arm Base Pico (J1, J2A, J2B, J3)
#   [SLAVE2]  -> Wrist Pico     (J4, J5, J6, Gripper)
#
# Upload:  nite_upload_config.py <COM> nite.cfg
#   or via terminal: CONFIG <enter>, paste file, CONFIG-END <enter>
#   or over UDP (Ethernet) once the link is up.
#
# Dump current settings from the Master with:  $$
# Set a single value with:                     $SECTION.key=value
# Persist / reload:                            SAVE  /  LOAD
#
# Defaults below match the factory firmware. The uploader can also
# regenerate linuxcnc/nite_369.ini and nite_8_axis.hal from this file:
#   nite_upload_config.py nite.cfg --gen-linuxcnc
# =============================================================================

[MASTER]
ip = 192.168.1.100
mac = 00:08:DC:11:22:33
port = 5000
heartbeat_timeout_us = 100000

[SLAVE1]
# steps_per_unit = counts per degree (must match LinuxCNC SCALE values)
steps_per_unit = 211.56 400.00 400.00 266.67
dir_invert = 0 0 0 0
limit_polarity = 0 0 0
ladrc_wc = 20.00
ladrc_wo = 100.00
ladrc_b0 = 120.00
max_speed = 1500.00
output_slew = 10.00
deadband = 25.00
# TMC settings only used on Slave 2 (TMC2209 UART bus)
tmc_current_ma = 1000
tmc_microsteps = 8
tmc_stealthchop = 0

[SLAVE2]
steps_per_unit = 142.22 222.22 222.22 1.00
dir_invert = 0 0 0 0
limit_polarity = 0 0 0
ladrc_wc = 20.00
ladrc_wo = 100.00
ladrc_b0 = 120.00
max_speed = 1500.00
output_slew = 10.00
deadband = 25.00
tmc_current_ma = 1000
tmc_microsteps = 8
tmc_stealthchop = 0
